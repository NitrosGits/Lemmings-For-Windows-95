# Builds the native 64-bit macOS game (arm64) on its AppKit and Core Audio
# backend (PORTING.md): the plain executable, and Lemmings.app, uploaded as
# the artifact. Only the system's frameworks are needed. The game's data
# files are not part of the repository, so CI only builds: put the WINLEMM
# folder of an original installation into Lemmings.app/Contents/Resources, or
# start the game with --data <folder>.
name: macOS build

on:
  push:
    branches: [macOS-64]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [macOS-64]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Build the executable
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native
          file build/native/lemmings | grep -q arm64

      - name: Build Lemmings.app
        run: |
          cmake -S . -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release -DLEMMINGS_MACOS_BUNDLE=ON
          cmake --build build/app
          # the system's libraries only (bash -e ignores a failing "! cmd", hence the if)
          if otool -L build/app/Lemmings.app/Contents/MacOS/Lemmings | grep -v '^build' | grep -v '/System/Library/\|/usr/lib/'; then
            echo "links a library that isn't the system's"; exit 1
          fi
          codesign --verify build/app/Lemmings.app

      - name: Start without game data
        # no data: it must stop at once with its "needs the original files" message, not crash
        run: |
          set +e
          LEMMINGS_HARNESS=1 build/native/lemmings --data /nonexistent > out.txt 2>&1
          code=$?
          cat out.txt
          test $code -eq 1 && grep -q "has no GFX folder" out.txt

      - name: Pack
        run: ditto -c -k --keepParent build/app/Lemmings.app lemmings-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lemmings-macos-arm64
          path: lemmings-macos-arm64.zip
