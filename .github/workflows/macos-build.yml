# Builds the native 64-bit macOS game (arm64) on the SDL3 platform layer
# (PORTING.md): the plain executable, and Lemmings.app with its own copy of
# SDL3, uploaded as the artifact. The game's data files are not part of the
# repository, so CI only builds: put the WINLEMM folder of an original
# installation into Lemmings.app/Contents/Resources, or start the game with
# --data <folder>.
name: macOS build

on:
  push:
    branches: [macOS-64]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [macOS-64]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3 and Ninja
        run: brew install sdl3 ninja

      - name: Build the executable
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native
          file build/native/lemmings | grep -q arm64

      - name: Build Lemmings.app
        run: |
          cmake -S . -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release -DLEMMINGS_MACOS_BUNDLE=ON
          cmake --build build/app
          otool -L build/app/Lemmings.app/Contents/MacOS/Lemmings | grep -q '@rpath/libSDL3'
          codesign --verify build/app/Lemmings.app

      - name: Start without game data
        # no data: it must stop at once with its "needs the original files" message, not crash
        run: |
          set +e
          SDL_VIDEO_DRIVER=dummy LEMMINGS_HARNESS=1 build/native/lemmings --data /nonexistent > out.txt 2>&1
          code=$?
          cat out.txt
          test $code -eq 1 && grep -q "has no GFX folder" out.txt

      - name: Pack
        run: ditto -c -k --keepParent build/app/Lemmings.app lemmings-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lemmings-macos-arm64
          path: lemmings-macos-arm64.zip
